name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sandbox .
      # The agent pattern: a script in the sandbox scans mounted code and prints a summary.
      - name: Scan the fixture inside the sandbox
        run: |
          cat > scan.mjs <<'EOF'
          import { scan, summarize } from "@trustabl/code-execution-agent-reliability-analyzer";
          const s = summarize(await scan("/workspace/test/fixture"));
          console.log(JSON.stringify(s));
          if (s.nothingScanned || s.inventory.tools < 1) process.exit(1);
          EOF
          docker run --rm -v "$PWD:/workspace" sandbox node scan.mjs
